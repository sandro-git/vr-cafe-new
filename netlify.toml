# Netlify configuration
[build]
  command = "bun run build"
  publish = "dist"

[dev]
  command = "bun run dev:netlify"
  targetPort = 4321
  port = 8888

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.2"

# Link headers RFC 8288 pour la découverte par les agents
[[headers]]
  for = "/"
  [headers.values]
    Link = '''</.well-known/api-catalog>; rel="api-catalog", </sitemap-index.xml>; rel="sitemap"'''

# Configuration pour les fichiers .well-known
# Important pour Apple Pay et autres services
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/agent-skills/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirection pour s'assurer que les fichiers .well-known sont accessibles
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = false

# Fusion du catalogue de jeux (4 anciennes pages) en une page unique avec filtres
[[redirects]]
  from = "/jeux"
  to = "/experiences-vr?famille=jeux"
  status = 301
  force = true

[[redirects]]
  from = "/escapes"
  to = "/experiences-vr?famille=escape"
  status = 301
  force = true

[[redirects]]
  from = "/freeroaming"
  to = "/experiences-vr?famille=jeux&mode=sans-fil"
  status = 301
  force = true

[[redirects]]
  from = "/escapesFreeroaming"
  to = "/experiences-vr?famille=escape&mode=sans-fil"
  status = 301
  force = true

# Jeux renommés (URLs indexées par Google sous l'ancien slug)
[[redirects]]
  from = "/cyber-clash"
  to = "/cyber-clash-tournament"
  status = 301
  force = true

[[redirects]]
  from = "/~partytown"
  to = "/partyplayland"
  status = 301
  force = true

# Ancienne structure d'URL /escapes/:editeur (pré-refonte catalogue)
[[redirects]]
  from = "/escapes/*"
  to = "/experiences-vr?famille=escape"
  status = 301
  force = true

# Jeux définitivement retirés du catalogue mais encore re-crawlés par Google
# (404 persistants sur Search Console) : redirection douce vers le catalogue
